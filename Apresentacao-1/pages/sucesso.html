<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedido Confirmado | Koketsu Grife</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Outfit:wght@900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/global/variables.css">
    <link rel="stylesheet" href="../assets/css/global/main.css">
    <style>
        .success-wrapper {
            min-height: 80vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding-top: 100px;
        }

        .check-icon {
            font-size: 100px;
            color: var(--color-primary);
            margin-bottom: 2rem;
            animation: scaleUp 0.6s cubic-bezier(0.17, 0.67, 0.83, 0.67);
        }

        @keyframes scaleUp {
            0% {
                transform: scale(0);
                opacity: 0;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
    </style>
</head>

<body class="bg-black text-white">
    <div class="container success-wrapper">
        <i class="bi bi-check-circle-fill check-icon"></i>
        <h1 class="display-3 fw-black uppercase mb-4 outfit-font">PEDIDO RECEBIDO!</h1>
        <p class="lead text-secondary mb-5">
            Obrigado por escolher a Koketsu Grife. <br>
            Você receberá um e-mail com todos os detalhes do seu pedido.
        </p>
        <div class="d-flex gap-3">
            <a href="../index.html" class="btn btn-outline-light px-5 py-3 fw-bold">VOLTAR AO INÍCIO</a>
            <a href="catalogo.html" class="btn btn-primary-gold px-5 py-3 fw-bold">CONTINUAR COMPRANDO</a>
        </div>
    </div>

    <script src="../assets/js/utils.js"></script>
    <script src="../assets/js/animations.js"></script>
</body>

</html>
