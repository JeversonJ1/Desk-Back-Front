            <div class="flex items-center gap-4 mb-6">

                <i class="bi bi-star"></i>
                <i class="bi bi-star"></i>
                <i class="bi bi-star"></i>
                <i class="bi bi-star"></i>
              </div>
              <a href="#tab-reviews" class="text-sm text-gray-400 hover:text-white transition" id="product-rating-count-text">(0 avaliações)</a>
            </div>

            <div class="mb-8 p-6 bg-[#111] rounded-2xl border border-white/5">

              <p class="text-4xl font-bold text-white mb-2" id="price-current">R$ 00,00</p>
              <p class="text-xs text-[var(--brand-yellow)] font-bold tracking-[0.1em] uppercase" id="price-installments">em até 6x de R$ 0,00 sem juros</p>
            </div>

            <!-- Seletores -->
            <div class="mb-6">
              <span class="block text-xs font-bold text-gray-400 uppercase tracking-[0.1em] mb-3">Selecione o Tamanho</span>

                <input type="radio" name="size" id="size-m" class="hidden peer/m" checked><label for="size-m"
                  class="w-12 h-12 flex items-center justify-center border border-gray-700 rounded-lg cursor-pointer text-sm font-bold peer-checked/m:bg-[var(--brand-yellow)] peer-checked/m:text-black peer-checked/m:border-[var(--brand-yellow)] hover:border-gray-500 transition">M</label>
                <input type="radio" name="size" id="size-g" class="hidden peer/g"><label for="size-g"
                  class="w-12 h-12 flex items-center justify-center border border-gray-700 rounded-lg cursor-pointer text-sm font-bold peer-checked/g:bg-[var(--brand-yellow)] peer-checked/g:text-black peer-checked/g:border-[var(--brand-yellow)] hover:border-gray-500 transition">G</label>
                <input type="radio" name="size" id="size-gg" class="hidden peer/gg"><label for="size-gg"

                <input type="radio" name="size" id="size-xg" class="hidden peer/xg"><label for="size-xg"

            </div>

      <!-- Tabs de Informações -->

                  <label class="block text-gray-400 text-xs font-bold tracking-[0.1em] uppercase mb-3">Sua Nota</label>

                    <i class="bi bi-star rating-star hover:text-[var(--brand-yellow)] transition" data-value="2"></i>
                    <i class="bi bi-star rating-star hover:text-[var(--brand-yellow)] transition" data-value="3"></i>
                    <i class="bi bi-star rating-star hover:text-[var(--brand-yellow)] transition" data-value="4"></i>
                    <i class="bi bi-star rating-star hover:text-[var(--brand-yellow)] transition" data-value="5"></i>
                    <input type="hidden" name="rating" id="review-rating-value" value="5">
                  </div>
                </div>
                <div class="mb-6">
                  <label for="review-comment" class="block text-gray-400 text-xs font-bold tracking-[0.1em] uppercase mb-3">Seu Comentário</label>
                  <textarea class="w-full bg-black text-white border border-gray-800 rounded-xl p-4 focus:border-[var(--brand-yellow)] focus:ring-1 focus:ring-[var(--brand-yellow)] transition outline-none" id="review-comment" rows="4"
                    required></textarea>
                </div>
                <button type="submit" class="bg-[var(--brand-yellow)] text-black font-bold tracking-[0.1em] uppercase px-8 py-3 rounded-lg hover:brightness-110 transition shadow-lg shadow-yellow-500/20">ENVIAR AVALIAÇÃO</button>
              </form>
            </div>
          </div>
        </div>
      </section>

      <!-- Produtos Relacionados -->
      <section class="mt-24 pb-12">
        <div class="text-center mb-12">
          <h2 class="font-['Outfit'] text-3xl font-extrabold text-white tracking-[0.2em] uppercase">QUEM VIU, TAMBÉM VIU</h2>
          <div class="w-16 h-1 bg-[var(--brand-yellow)] mx-auto mt-4 rounded-full"></div>
        </div>
        <div id="related-products-grid" class="grid grid-cols-2 md:grid-cols-4 gap-4 md:gap-6">
          <!-- Carregado via JS -->
        </div>
      </section>

    </div>

  <!-- Modal de Login & Footer Renderizado em Utils.js -->
  <footer></footer>

  <!-- Scripts -->
  <script>
    function switchProductTab(tab) {
      document.getElementById('tab-description').classList.add('hidden');
      document.getElementById('tab-reviews').classList.add('hidden');
      document.getElementById('tab-btn-description').className = 'px-8 py-4 border-b-2 border-transparent text-gray-500 hover:text-white font-bold uppercase text-sm tracking-wider transition';
      document.getElementById('tab-btn-reviews').className = 'px-8 py-4 border-b-2 border-transparent text-gray-500 hover:text-white font-bold uppercase text-sm tracking-wider transition';

      if(tab === 'description') {
        document.getElementById('tab-description').classList.remove('hidden');
        document.getElementById('tab-btn-description').className = 'px-8 py-4 border-b-2 border-[var(--brand-yellow)] text-[var(--brand-yellow)] font-bold uppercase text-sm tracking-wider';
      } else {
        document.getElementById('tab-reviews').classList.remove('hidden');
        document.getElementById('tab-btn-reviews').className = 'px-8 py-4 border-b-2 border-[var(--brand-yellow)] text-[var(--brand-yellow)] font-bold uppercase text-sm tracking-wider';
      }
    }
  </script>
  <script src="../assets/js/utils.js?v=1.1"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
        window.Utils.loadPartials();

        // Adjust rating stars script
        const stars = document.querySelectorAll('.rating-star');
        const ratingInput = document.getElementById('review-rating-value');
        if(stars.length > 0) {
            const highlightStars = (val) => {
                stars.forEach(s => {
                    if (parseInt(s.dataset.value) <= val) {
                        s.classList.add('text-[var(--brand-yellow)]');
                        s.classList.replace('bi-star', 'bi-star-fill');
                    } else {
                        s.classList.remove('text-[var(--brand-yellow)]');
                        s.classList.replace('bi-star-fill', 'bi-star');
                    }
                });
            };
            stars.forEach(star => {
                star.addEventListener('mouseover', () => highlightStars(parseInt(star.dataset.value)));
                star.addEventListener('mouseleave', () => highlightStars(parseInt(ratingInput.value)));
                star.addEventListener('click', () => { ratingInput.value = star.dataset.value; highlightStars(parseInt(star.dataset.value)); });
            });
            highlightStars(5);
        }
    });

    // Make adjustQty available to onclick
    function adjustQty(change) {
       const input = document.getElementById('buy-qty');
       let current = parseInt(input.value) || 1;
       current += change;
       if(current < 1) current = 1;
       if(current > 99) current = 99;
       input.value = current;
    }
  </script>
