<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produto | Koketsu Grife</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
      tailwind.config = { corePlugins: { preflight: false } }
  </script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/global/variables.css">
  <link rel="stylesheet" href="../assets/css/global/main.css">
  <link rel="stylesheet" href="../assets/css/components/menu-modal.css">
  <link rel="stylesheet" href="../assets/css/global/footer.css">
  <link rel="stylesheet" href="../assets/css/components/produto.css">
  <link rel="stylesheet" href="../assets/css/components/reviews.css">
  <link rel="stylesheet" href="../assets/css/components/auth.css">
  <link rel="icon" type="image/png" href="../assets/img/logo2026.png">
  <style>
    .fade-in { animation: fadeIn 0.8s ease forwards; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    
    /* Scrollbar oculta para as thumbs */
    .custom-scrollbar-hidden::-webkit-scrollbar { display: none; }
    .custom-scrollbar-hidden { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>

<body class="bg-[var(--brand-dark)] text-white font-['Inter']">
  <header></header>

  <main class="pt-6 pb-16">
    <div class="container mx-auto px-4 lg:px-6 max-w-[1100px]">

      <!-- Breadcrumb -->
      <nav aria-label="breadcrumb" class="mb-6 text-[10px] text-gray-500 uppercase tracking-widest font-bold">
        <ol class="flex space-x-2" id="product-breadcrumb">
          <li><a href="/" class="hover:text-white transition">Home</a> <span class="mx-2">/</span></li>
          <li><a href="catalogo.html" class="hover:text-white transition" id="breadcrumb-cat">Loja</a> <span class="mx-2">/</span></li>
          <li class="text-[var(--brand-yellow)]" aria-current="page" id="breadcrumb-current">Carregando...</li>
        </ol>
      </nav>

      <div class="bg-[#111] border border-white/5 p-4 lg:p-5 shadow-2xl rounded-2xl">
        <div class="flex flex-col lg:flex-row gap-5">
          
          <!-- Coluna 1: Miniaturas Verticais (escondido no mobile) -->
          <div class="hidden lg:flex flex-col gap-2 w-16 shrink-0 relative">
            <button class="text-gray-500 hover:text-white mx-auto transition"><i class="bi bi-chevron-up"></i></button>
            <div id="product-gallery-thumbnails" class="flex flex-col gap-2 overflow-y-auto max-h-[480px] custom-scrollbar-hidden items-center w-full">
                <!-- Thumbs loaded by JS -->
            </div>
          </div>

          <!-- Coluna 2: Imagem Principal + Galeria Mobile -->
          <div class="w-full lg:flex-1 flex flex-col gap-3 product-gallery main-image-container-wrapper">
             <!-- Imagem principal -->
             <div class="aspect-[4/5] lg:aspect-[4/5] bg-[#0a0a0a] border border-white/5 rounded-xl overflow-hidden main-image-container relative flex items-center justify-center">
                <img id="main-product-img" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" class="w-full h-full object-cover fade-in" alt="Produto" style="cursor:zoom-in;">
             </div>
             <!-- Miniaturas Horizontais (visível apenas no mobile) -->
             <div id="product-gallery-mobile" class="flex lg:hidden gap-2 overflow-x-auto custom-scrollbar-hidden py-1">
               <!-- Thumbs carregados pelo JS -->
             </div>
          </div>

          <!-- Coluna 3: Informações do Produto -->
          <div class="w-full lg:w-[320px] shrink-0 pt-1">
            <div class="fade-in">
              <h1 class="font-['Outfit'] text-2xl font-black uppercase mb-2 text-white" id="product-name">Buscando produto...</h1>

              <div class="flex items-center gap-2 mb-6 text-[11px] font-bold text-gray-400">
                <div class="flex text-[var(--brand-yellow)] text-sm" id="product-rating-stars">
                  <i class="bi bi-star-fill"></i><i class="bi bi-star-fill"></i><i class="bi bi-star-fill"></i><i class="bi bi-star-fill"></i><i class="bi bi-star-half"></i>
                </div>
                <a href="#tab-reviews" class="hover:text-white transition" id="product-rating-count-text">(0) - Faça uma avaliação</a>
              </div>
              
              <p id="product-short-desc" class="hidden"></p>
              
              <!-- Preços -->
              <div class="mb-6 bg-[#0a0a0a] border border-white/5 p-4 rounded-xl">
                <div class="flex items-end gap-2 flex-wrap">
                    <p class="text-3xl font-black text-[var(--brand-yellow)]" id="price-current">R$ 00,00</p>
                    <p class="text-[11px] text-gray-400 mb-1 hidden" id="price-discount-container">OU <span class="text-[var(--brand-yellow)] font-bold text-lg" id="price-discount">R$ 00,00</span> na compra de 3 ou mais peças</p>
                </div>
              </div>

              <!-- Cor -->
              <div class="mb-6">
                <span class="block text-[13px] font-bold text-gray-300 uppercase tracking-widest mb-3">Cor:</span>
                <div class="color-selector flex gap-3 flex-wrap">
                  <!-- Carregado via JS -->
                </div>
              </div>

              <!-- Tamanho -->
              <div class="mb-6 relative">
                <span class="block text-[13px] font-bold text-gray-300 uppercase tracking-widest mb-3">Tamanho:</span>
                <div class="flex gap-2 flex-wrap size-selector" id="size-selector-container">
                  <input type="radio" name="size" id="size-p" class="hidden peer/p"><label for="size-p"
                    class="w-12 h-12 flex items-center justify-center border border-gray-700 bg-black rounded-lg cursor-pointer text-sm font-bold text-gray-400 peer-checked/p:border-[var(--brand-yellow)] peer-checked/p:text-black peer-checked/p:bg-[var(--brand-yellow)] hover:border-gray-500 transition shadow-[0_0_15px_rgba(248,211,70,0)] peer-checked/p:shadow-[0_0_15px_rgba(248,211,70,0.3)]">P</label>
                  <input type="radio" name="size" id="size-m" class="hidden peer/m" checked><label for="size-m"
                    class="w-12 h-12 flex items-center justify-center border border-gray-700 bg-black rounded-lg cursor-pointer text-sm font-bold text-gray-400 peer-checked/m:border-[var(--brand-yellow)] peer-checked/m:text-black peer-checked/m:bg-[var(--brand-yellow)] hover:border-gray-500 transition shadow-[0_0_15px_rgba(248,211,70,0)] peer-checked/m:shadow-[0_0_15px_rgba(248,211,70,0.3)]">M</label>
                  <input type="radio" name="size" id="size-g" class="hidden peer/g"><label for="size-g"
                    class="w-12 h-12 flex items-center justify-center border border-gray-700 bg-black rounded-lg cursor-pointer text-sm font-bold text-gray-400 peer-checked/g:border-[var(--brand-yellow)] peer-checked/g:text-black peer-checked/g:bg-[var(--brand-yellow)] hover:border-gray-500 transition shadow-[0_0_15px_rgba(248,211,70,0)] peer-checked/g:shadow-[0_0_15px_rgba(248,211,70,0.3)]">G</label>
                  <input type="radio" name="size" id="size-gg" class="hidden peer/gg"><label for="size-gg"
                    class="w-12 h-12 flex items-center justify-center border border-gray-700 bg-black rounded-lg cursor-pointer text-sm font-bold text-gray-400 peer-checked/gg:border-[var(--brand-yellow)] peer-checked/gg:text-black peer-checked/gg:bg-[var(--brand-yellow)] hover:border-gray-500 transition shadow-[0_0_15px_rgba(248,211,70,0)] peer-checked/gg:shadow-[0_0_15px_rgba(248,211,70,0.3)]">GG</label>
                  <input type="radio" name="size" id="size-xg" class="hidden peer/xg"><label for="size-xg"
                    class="w-12 h-12 flex items-center justify-center border border-gray-700 bg-black rounded-lg cursor-pointer text-sm font-bold text-gray-400 peer-checked/xg:border-[var(--brand-yellow)] peer-checked/xg:text-black peer-checked/xg:bg-[var(--brand-yellow)] hover:border-gray-500 transition shadow-[0_0_15px_rgba(248,211,70,0)] peer-checked/xg:shadow-[0_0_15px_rgba(248,211,70,0.3)]">XG</label>
                </div>
              </div>



              <!-- Botão Adicionar -->
              <div class="mb-8 flex flex-col sm:flex-row gap-4">
                  <div class="flex items-center border border-gray-700 rounded-xl bg-black px-2">
                    <button class="w-12 h-12 flex items-center justify-center text-gray-400 hover:text-[var(--brand-yellow)] transition" onclick="adjustQty(-1)"><i class="bi bi-dash text-xl"></i></button>
                    <input type="number" value="1" min="1" class="w-12 h-12 bg-transparent text-center text-white border-none focus:ring-0 font-bold p-0 m-0 [&::-webkit-inner-spin-button]:appearance-none" id="buy-qty" readonly>
                    <button class="w-12 h-12 flex items-center justify-center text-gray-400 hover:text-[var(--brand-yellow)] transition" onclick="adjustQty(1)"><i class="bi bi-plus text-xl"></i></button>
                  </div>
                  <button class="flex-1 bg-[var(--brand-yellow)] text-black font-black text-sm py-4 rounded-xl hover:brightness-110 transition uppercase tracking-[0.1em] shadow-[0_10px_20px_rgba(248,211,70,0.2)] flex items-center justify-center gap-2" id="btn-add-to-cart">
                    <i class="bi bi-bag-plus text-lg"></i> ADICIONAR AO CARRINHO
                  </button>
              </div>

            </div>
          </div>
        </div>
      </div>

      <!-- Tabs de Informações -->
      <section class="mt-16 bg-[#111] border border-white/5 p-8 rounded-2xl shadow-2xl">
        <div class="flex border-b border-gray-800 mb-8" id="productTabs" role="tablist">
            <button class="px-8 py-4 border-b-2 border-[var(--brand-yellow)] text-[var(--brand-yellow)] font-bold uppercase text-sm tracking-wider" id="tab-btn-description" onclick="switchProductTab('description')">
              Descrição
            </button>
            <button class="px-8 py-4 border-b-2 border-transparent text-gray-500 hover:text-white font-bold uppercase text-sm tracking-wider transition" id="tab-btn-reviews" onclick="switchProductTab('reviews')">
              Avaliações
            </button>
        </div>

        <div>
          <div id="tab-description" class="block">
            <p id="product-long-desc" class="text-gray-300 leading-loose">Carregando descrição do produto...</p>
          </div>
          <div id="tab-reviews" class="hidden">
            <div id="reviews-list">
              <!-- Cargado via JS -->
              <div class="flex justify-center py-8">
                <div class="animate-spin rounded-full h-8 w-8 border-t-2 border-b-2 border-[var(--brand-yellow)]"></div>
              </div>
            </div>

            <!-- Form de Avaliação -->
            <div id="review-form-container" class="mt-8 p-8 bg-[#0a0a0a] border border-white/5 rounded-2xl hidden shadow-2xl">
              <h4 class="text-white text-xl font-bold mb-6 font-['Outfit'] tracking-[0.1em] uppercase">Sua Avaliação</h4>
              <form id="product-review-form">
                <div class="mb-6">
                  <label class="block text-gray-400 text-xs font-bold tracking-[0.1em] uppercase mb-3">Sua Nota</label>
                  <div class="flex text-3xl text-gray-700 gap-2 cursor-pointer transition-colors" id="star-rating-container">
                    <i class="bi bi-star rating-star hover:text-[var(--brand-yellow)] transition" data-value="1"></i>
                    <i class="bi bi-star rating-star hover:text-[var(--brand-yellow)] transition" data-value="2"></i>
                    <i class="bi bi-star rating-star hover:text-[var(--brand-yellow)] transition" data-value="3"></i>
                    <i class="bi bi-star rating-star hover:text-[var(--brand-yellow)] transition" data-value="4"></i>
                    <i class="bi bi-star rating-star hover:text-[var(--brand-yellow)] transition" data-value="5"></i>
                    <input type="hidden" name="rating" id="review-rating-value" value="5">
                  </div>
                </div>
                <div class="mb-6">
                  <label for="review-comment" class="block text-gray-400 text-xs font-bold tracking-[0.1em] uppercase mb-3">Seu Comentário</label>
                  <textarea class="w-full bg-black text-white border border-gray-800 rounded-xl p-4 focus:border-[var(--brand-yellow)] focus:ring-1 focus:ring-[var(--brand-yellow)] transition outline-none" id="review-comment" rows="4"
                    required></textarea>
                </div>
                <button type="submit" class="bg-[var(--brand-yellow)] text-black font-bold tracking-[0.1em] uppercase px-8 py-3 rounded-lg hover:brightness-110 transition shadow-[0_5px_15px_rgba(248,211,70,0.2)]">ENVIAR AVALIAÇÃO</button>
              </form>
            </div>
          </div>
        </div>
      </section>

      <!-- Produtos Relacionados -->
      <section class="mt-16 pb-12">
        <div class="text-center mb-12">
          <h2 class="font-['Outfit'] text-2xl font-black text-white tracking-[0.2em] uppercase">QUEM VIU, TAMBÉM VIU</h2>
          <div class="w-16 h-1 bg-[var(--brand-yellow)] mx-auto mt-4 rounded-full"></div>
        </div>
        <div id="related-products-grid" class="grid grid-cols-2 md:grid-cols-4 gap-4 md:gap-6">
          <!-- Carregado via JS -->
        </div>
      </section>

    </div>
  </main>

  <!-- Modal de Login & Footer Renderizado em Utils.js -->
  <footer></footer>

  <!-- Scripts -->
  <script>
    function switchProductTab(tab) {
      document.getElementById('tab-description').classList.add('hidden');
      document.getElementById('tab-reviews').classList.add('hidden');
      document.getElementById('tab-btn-description').className = 'px-8 py-4 border-b-2 border-transparent text-gray-500 hover:text-white font-bold uppercase text-sm tracking-wider transition';
      document.getElementById('tab-btn-reviews').className = 'px-8 py-4 border-b-2 border-transparent text-gray-500 hover:text-white font-bold uppercase text-sm tracking-wider transition';

      if(tab === 'description') {
        document.getElementById('tab-description').classList.remove('hidden');
        document.getElementById('tab-btn-description').className = 'px-8 py-4 border-b-2 border-[var(--brand-yellow)] text-[var(--brand-yellow)] font-bold uppercase text-sm tracking-wider';
      } else {
        document.getElementById('tab-reviews').classList.remove('hidden');
        document.getElementById('tab-btn-reviews').className = 'px-8 py-4 border-b-2 border-[var(--brand-yellow)] text-[var(--brand-yellow)] font-bold uppercase text-sm tracking-wider';
      }
    }
  </script>
  <script src="../assets/js/utils.js?v=1.1"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
        window.Utils.loadPartials();

        // Adjust rating stars script
        const stars = document.querySelectorAll('.rating-star');
        const ratingInput = document.getElementById('review-rating-value');
        if(stars.length > 0) {
            const highlightStars = (val) => {
                stars.forEach(s => {
                    if (parseInt(s.dataset.value) <= val) {
                        s.classList.add('text-[var(--brand-yellow)]');
                        s.classList.replace('bi-star', 'bi-star-fill');
                    } else {
                        s.classList.remove('text-[var(--brand-yellow)]');
                        s.classList.replace('bi-star-fill', 'bi-star');
                    }
                });
            };
            stars.forEach(star => {
                star.addEventListener('mouseover', () => highlightStars(parseInt(star.dataset.value)));
                star.addEventListener('mouseleave', () => highlightStars(parseInt(ratingInput.value)));
                star.addEventListener('click', () => { ratingInput.value = star.dataset.value; highlightStars(parseInt(star.dataset.value)); });
            });
            highlightStars(5);
        }
    });

    // adjustQty é definida no produto.js — não duplicar aqui
  </script>
  <script src="../assets/js/navbar.js?v=1.1"></script>
  <script src="../assets/js/mega-menu.js?v=1.0"></script>
  <script src="../assets/js/search.js?v=1.1"></script>
  <script src="../assets/js/accordion.js?v=1.1"></script>
  <script src="../assets/js/cart.js?v=1.1"></script>
  <script src="../assets/js/produto.js?v=2.0"></script>
  <script src="../assets/js/reviews.js?v=1.1"></script>
  <script src="../assets/js/auth.js?v=1.1"></script>
  <script src="../assets/js/categorias.js"></script>
</body>
</html>
