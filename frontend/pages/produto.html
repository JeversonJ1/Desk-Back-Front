<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produto | Koketsu Grife</title>

  <!-- CSS Base -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Estilos Customizados -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Outfit:wght@400;700;900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/global/variables.css">
  <link rel="stylesheet" href="../assets/css/global/main.css">
  <link rel="stylesheet" href="../assets/css/global/footer.css">
  <link rel="stylesheet" href="../assets/css/components/produto.css">
  <link rel="stylesheet" href="../assets/css/components/reviews.css">
  <link rel="stylesheet" href="../assets/css/components/auth.css">
  <link rel="icon" type="image/png" href="../assets/img/logo2026.png">
  <style>
    /* Ajuste para carregar imagens lazy */
    .fade-in {
      animation: fadeIn 0.8s ease forwards;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }
  </style>
</head>

<body>
  <header></header>

  <main class="product-detail-section">
    <div class="container px-lg-5">

      <!-- Breadcrumb -->
      <nav aria-label="breadcrumb" class="breadcrumb-premium">
        <ol class="breadcrumb" id="product-breadcrumb">
          <li class="breadcrumb-item"><a href="../index.html">Home</a></li>
          <li class="breadcrumb-item"><a href="catalogo.html">Loja</a></li>
          <li class="breadcrumb-item active" aria-current="page" id="breadcrumb-current">Carregando...</li>
        </ol>
      </nav>

      <div class="row g-5">
        <!-- Galeria de Imagens -->
        <div class="col-lg-6">
          <div class="product-gallery">
            <div class="main-image-container fade-in">
              <img id="main-product-img" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="Produto">
            </div>
          </div>
        </div>

        <!-- Informações do Produto -->
        <div class="col-lg-6">
          <div class="product-info-column fade-in">
            <span class="product-category" id="product-category">GERAL</span>
            <h1 class="product-title" id="product-name">Buscando produto...</h1>

            <div class="product-rating">
              <div class="stars" id="product-rating-stars">
                <i class="bi bi-star"></i>
                <i class="bi bi-star"></i>
                <i class="bi bi-star"></i>
                <i class="bi bi-star"></i>
                <i class="bi bi-star"></i>
              </div>
              <a href="#tab-reviews" class="rating-count" id="product-rating-count-text">(0 avaliações)</a>
            </div>
            
            <p id="product-short-desc" class="product-short-desc mt-3 text-secondary" style="font-size: 0.95rem; line-height: 1.6; max-height: 120px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 4; line-clamp: 4; -webkit-box-orient: vertical;"></p>

            <div class="product-price-container">
              <p class="price-old" id="price-old">R$ 00,00</p>
              <p class="price-current" id="price-current">R$ 00,00</p>
              <p class="price-installments" id="price-installments">em até 6x de R$ 0,00 sem juros</p>
            </div>

            <!-- Seletores -->
            <div class="attribute-group">
              <span class="attribute-label">Selecione o Tamanho</span>
              <div class="size-selector">
                <input type="radio" name="size" id="size-p" class="size-option"><label for="size-p"
                  class="size-label">P</label>
                <input type="radio" name="size" id="size-m" class="size-option" checked><label for="size-m"
                  class="size-label">M</label>
                <input type="radio" name="size" id="size-g" class="size-option"><label for="size-g"
                  class="size-label">G</label>
                <input type="radio" name="size" id="size-gg" class="size-option"><label for="size-gg"
                  class="size-label">GG</label>
                <input type="radio" name="size" id="size-xg" class="size-option"><label for="size-xg"
                  class="size-label">XG</label>
              </div>
            </div>

            <div class="attribute-group mt-3">
              <span class="attribute-label">Selecione a Cor</span>
              <div class="color-selector">
                <!-- Carregado via JS -->
              </div>
            </div>

            <!-- Ações -->
            <div class="purchase-actions">
              <div class="quantity-selector">
                <button class="qty-btn" onclick="adjustQty(-1)"><i class="bi bi-dash"></i></button>
                <input type="number" value="1" min="1" class="qty-input" id="buy-qty" readonly>
                <button class="qty-btn" onclick="adjustQty(1)"><i class="bi bi-plus"></i></button>
              </div>
              <button class="btn btn-add-cart" id="btn-add-to-cart">
                <i class="bi bi-bag-plus"></i> ADICIONAR AO CARRINHO
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Tabs de Informações -->
      <section class="product-tabs-section">
        <ul class="nav nav-tabs nav-tabs-premium" id="productTabs" role="tablist">
          <li class="nav-item" role="presentation">
            <button class="nav-link active" id="desc-tab" data-bs-toggle="tab" data-bs-target="#tab-description"
              type="button" role="tab">Descrição</button>
          </li>
          <li class="nav-item" role="presentation">
            <button class="nav-link" id="reviews-tab" data-bs-toggle="tab" data-bs-target="#tab-reviews" type="button"
              role="tab">Avaliações</button>
          </li>
        </ul>

        <div class="tab-content tab-content-premium" id="productTabsContent">
          <div class="tab-pane fade show active" id="tab-description" role="tabpanel">
            <p id="product-long-desc">Carregando descrição do produto...</p>
          </div>
          <div class="tab-pane fade" id="tab-reviews" role="tabpanel">
            <div id="reviews-list">
              <!-- Cargado via JS -->
              <div class="text-center py-4">
                <div class="spinner-border text-warning" role="status">
                  <span class="visually-hidden">Carregando...</span>
                </div>
              </div>
            </div>

            <!-- Form de Avaliação (visível apenas para compradores) -->
            <div id="review-form-container" class="mt-5 p-4 review-form-premium rounded-4 d-none shadow-lg">
              <h4 class="text-white mb-3">Sua Avaliação</h4>
              <form id="product-review-form">
                <div class="mb-3">
                  <label class="form-label text-secondary small">Sua Nota</label>
                  <div class="star-rating fs-3 text-warning">
                    <i class="bi bi-star rating-star" data-value="1"></i>
                    <i class="bi bi-star rating-star" data-value="2"></i>
                    <i class="bi bi-star rating-star" data-value="3"></i>
                    <i class="bi bi-star rating-star" data-value="4"></i>
                    <i class="bi bi-star rating-star" data-value="5"></i>
                    <input type="hidden" name="rating" id="review-rating-value" value="5">
                  </div>
                </div>
                <div class="mb-3">
                  <label for="review-comment" class="form-label text-secondary small">Seu Comentário</label>
                  <textarea class="form-control bg-black text-white border-secondary" id="review-comment" rows="3"
                    required></textarea>
                </div>
                <button type="submit" class="btn btn-warning fw-bold px-4">ENVIAR AVALIAÇÃO</button>
              </form>
            </div>
          </div>
        </div>
      </section>

      <!-- Produtos Relacionados -->
      <section class="mt-5 pt-5 pb-5">
        <div class="text-center mb-5">
          <h2 class="h2-titulo">QUEM VIU, TAMBÉM VIU</h2>
          <div class="gold-divider mx-auto"></div>
        </div>
        <div id="related-products-grid" class="row row-cols-2 row-cols-md-4 g-4 mt-4">
          <!-- Carregado via JS -->
        </div>
      </section>

    </div>
  </main>

  <!-- Modal de Login & Footer Renderizado em Utils.js -->
  <footer></footer>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/utils.js?v=1.1"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
        window.Utils.loadPartials();
    });
  </script>
  <script src="../assets/js/navbar.js?v=1.1"></script>
  <script src="../assets/js/search.js?v=1.1"></script>
  <script src="../assets/js/accordion.js?v=1.1"></script>
  <script src="../assets/js/cart.js?v=1.1"></script>
  <script src="../assets/js/produto.js?v=1.1"></script>
  <script src="../assets/js/reviews.js?v=1.1"></script>
  <script src="../assets/js/auth.js?v=1.1"></script>
  <script src="../assets/js/categorias.js"></script>
</body>

</html>
