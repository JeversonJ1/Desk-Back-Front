<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Camisetas Oversized | Koketsu Grife</title>
  <meta name="description" content="Collection of oversized T-shirts by Koketsu Grife — exclusive streetwear for the urban elite.">
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
      tailwind.config = { corePlugins: { preflight: false } }
  </script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/global/variables.css">
  <link rel="stylesheet" href="../assets/css/global/main.css">
    <link rel="stylesheet" href="../assets/css/components/menu-modal.css">
  <link rel="stylesheet" href="../assets/css/global/footer.css">
  <link rel="stylesheet" href="../assets/css/global/catalogo.css">
  <link rel="stylesheet" href="../assets/css/global/catalogo-modern.css">
  <link rel="stylesheet" href="../assets/css/components/auth.css">
  <link rel="icon" type="image/png" href="../assets/img/logo2026.png">
</head>

<body class="bg-[var(--brand-dark)] text-white">

  <header></header>

  <section class="catalog-hero-new text-center py-16 bg-[#111] border-b border-white/10 mt-20">
    <div class="container mx-auto px-4">
      <h1 class="shimmer-title drop-shadow-[0_0_15px_rgba(242,200,75,0.3)]">CAMISETAS OVERSIZED</h1>
      <p class="text-gray-400 max-w-2xl mx-auto text-lg tracking-wider font-light">Modelagem ampla, conforto premium e identidade streetwear em cada detalhe</p>
    </div>
  </section>

  <div class="container mx-auto px-4 lg:px-12 pt-8">
    <nav aria-label="breadcrumb">
      <ol class="flex text-sm text-gray-500 space-x-2">
        <li><a href="/" class="hover:text-white transition uppercase tracking-wider text-[10px] font-bold">Home</a> <span class="mx-2">/</span></li>
        <li><a href="catalogo.html" class="hover:text-white transition uppercase tracking-wider text-[10px] font-bold">Catálogo</a> <span class="mx-2">/</span></li>
        <li class="text-[var(--brand-yellow)] uppercase tracking-wider text-[10px] font-bold">Camisetas</li>
      </ol>
    </nav>
  </div>

  <main class="container mx-auto px-4 lg:px-12 pb-16 mt-8">
    <div class="flex flex-col lg:flex-row gap-8 lg:gap-12">

      <!-- Sidebar Filtros -->
      <aside class="w-full lg:w-1/4">
        <div class="sticky top-[100px]">
          <div class="bg-[#111] border border-white/5 rounded-2xl p-6 shadow-2xl">
            <div class="flex justify-between items-center mb-8 pb-4 border-b border-white/10">
              <h2 class="text-[var(--brand-yellow)] font-bold tracking-[0.1em] uppercase flex items-center gap-2"><i class="bi bi-sliders2-vertical"></i>FILTROS</h2>
              <button class="text-xs text-gray-500 hover:text-white transition uppercase tracking-[0.1em] font-bold">Limpar Tudo</button>
            </div>

            <!-- Tamanhos -->
            <div class="mb-6">
              <span class="block text-sm font-bold text-white uppercase tracking-[0.1em] mb-4">TAMANHOS</span>
              <div class="grid grid-cols-4 gap-2" id="size-filter-container">
                <p class="text-xs text-gray-500 m-0 col-span-4">Carregando tamanhos...</p>
              </div>
            </div>

            <hr class="border-white/10 my-6">

            <!-- Faixa de Preço -->
            <div class="mb-2">
              <span class="block text-sm font-bold text-white uppercase tracking-[0.1em] mb-4">FAIXA DE PREÇO</span>
              <div>
                <div class="relative pt-6">
                  <input type="range" class="w-full h-1 bg-gray-800 rounded-lg appearance-none cursor-pointer accent-[var(--brand-yellow)]" min="0" max="1000" id="rangePreco" value="1000">
                </div>
                <div class="flex justify-between text-xs text-gray-500 mt-2 font-bold tracking-[0.1em]">
                  <span>R$ 0</span>
                  <span class="text-[var(--brand-yellow)]" id="maxPriceLabel">R$ 1.000</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </aside>

      <!-- Produtos -->
      <section class="w-full lg:w-3/4">
        <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4 bg-[#111] p-4 rounded-xl border border-white/5">
          <span class="text-sm text-gray-400 tracking-[0.1em] uppercase font-bold">CAMISETAS OVERSIZED</span>
          <div class="flex items-center gap-3">
            <select class="bg-black text-white border border-gray-700 rounded-lg px-4 py-2 text-sm focus:border-[var(--brand-yellow)] outline-none transition">
              <option selected>Lançamentos</option>
              <option>Menor Preço</option>
              <option>Maior Preço</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-4 md:gap-6" id="vitrine-catalogo">
          <!-- Conteúdo carregado via JS -->
          <div class="col-span-full flex justify-center py-16">
            <div class="animate-spin rounded-full h-8 w-8 border-t-2 border-b-2 border-[var(--brand-yellow)]"></div>
          </div>
        </div>
      </section>

    </div>
  </main>

  <footer></footer>

  <script src="../assets/js/utils.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      window.Utils.loadPartials();
    });
  </script>
  <script src="../assets/js/animations.js"></script>
  <script src="../assets/js/navbar.js"></script>
  <script src="../assets/js/mega-menu.js?v=1.1"></script>
  <script src="../assets/js/search.js?v=2.1"></script>
  <script src="../assets/js/cart.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/categorias.js"></script>
  <script>
    // On load, pre-filter catalog by camisetas category
    document.addEventListener("DOMContentLoaded", () => {
      // Pass the categoria query param for the catalog JS to pick up
      const url = new URL(window.location.href);
      if (!url.searchParams.get('categoria')) {
        url.searchParams.set('categoria', 'camisetas');
        window.history.replaceState({}, '', url.toString());
      }
    });
  </script>
  <script src="../assets/js/catalogo.js?v=1.1"></script>
</body>

</html>
