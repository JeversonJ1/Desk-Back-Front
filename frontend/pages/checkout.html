<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finalizar Compra | Koketsu Grife</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Outfit:wght@400;700;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/global/variables.css">
    <link rel="stylesheet" href="../assets/css/global/main.css">
    <link rel="stylesheet" href="../assets/css/global/footer.css">
    <link rel="stylesheet" href="../assets/css/components/checkout.css">
</head>

<body class="bg-black">
    <!-- Navbar (Simplified) -->
    <header>
        <nav class="navbar scrolled">
            <div class="container d-flex justify-content-between align-items-center">
                <a href="../index.html" class="icon-link">
                    <i class="bi bi-arrow-left"></i> Voltar à Loja
                </a>
                <a href="../index.html">
                    <img src="../assets/img/logo2026.png" alt="Koketsu" height="50">
                </a>
                <div class="d-none d-md-block">
                    <i class="bi bi-shield-lock text-success me-2"></i> <span class="small text-secondary">Pagamento
                        Seguro</span>
                </div>
            </div>
        </nav>
    </header>

    <main class="checkout-section">
        <div class="container">
            <div class="checkout-grid">

                <!-- Lado Esquerdo: Formulários -->
                <div class="checkout-steps">

                    <!-- Passo 1: Entrega -->
                    <div class="checkout-card reveal">
                        <h2 class="checkout-step-title">
                            <span class="step-number">1</span> Dados de Entrega
                        </h2>
                        <form class="form-premium row g-3">
                            <div class="col-md-4">
                                <label class="form-label">CEP</label>
                                <input type="text" class="form-control" placeholder="00000-000">
                            </div>
                            <div class="col-md-8 d-flex align-items-end">
                                <span class="small text-secondary mb-2">Simule o frete para sua região</span>
                            </div>
                            <div class="col-12">
                                <label class="form-label">Endereço</label>
                                <input type="text" class="form-control" placeholder="Rua, Avenida, etc">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Número</label>
                                <input type="text" class="form-control" placeholder="123">
                            </div>
                            <div class="col-md-8">
                                <label class="form-label">Complemento</label>
                                <input type="text" class="form-control" placeholder="Apto, Bloco, etc">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Bairro</label>
                                <input type="text" class="form-control">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Cidade / UF</label>
                                <input type="text" class="form-control" placeholder="Ex: São Paulo - SP">
                            </div>
                        </form>
                    </div>

                    <!-- Passo 2: Pagamento -->
                    <div class="checkout-card reveal reveal-delay-1">
                        <h2 class="checkout-step-title">
                            <span class="step-number">2</span> Forma de Pagamento
                        </h2>
                        <div class="payment-options mb-4">
                            <div class="payment-method active">
                                <i class="bi bi-qr-code"></i>
                                <span class="small fw-bold">PIX (-5%)</span>
                            </div>
                            <div class="payment-method">
                                <i class="bi bi-credit-card"></i>
                                <span class="small fw-bold">CARTÃO</span>
                            </div>
                        </div>
                        <p class="small text-secondary text-center mb-0">
                            O código PIX será gerado após a confirmação do pedido.
                        </p>
                    </div>

                </div>

                <!-- Lado Direito: Resumo -->
                <div class="checkout-summary">
                    <div class="checkout-card sticky-top" style="top: 120px;">
                        <h4 class="text-white fw-bold mb-4 uppercase small letter-spacing-1">Resumo do Pedido</h4>
                        <div id="checkoutItemsList" class="mb-4">
                            <!-- Injetar via JS -->
                        </div>
                        <div class="border-top border-dark pt-3">
                            <div class="d-flex justify-content-between mb-2">
                                <span class="text-secondary small">Subtotal</span>
                                <span class="text-white small" id="summarySubtotal">R$ 0,00</span>
                            </div>
                            <div class="d-flex justify-content-between mb-2">
                                <span class="text-secondary small">Frete</span>
                                <span class="text-success small">GRÁTIS</span>
                            </div>
                            <div class="d-flex justify-content-between mt-3 pt-3 border-top border-dark">
                                <span class="text-white fw-bold">TOTAL</span>
                                <span class="gold-text fw-bold fs-4" id="summaryTotal">R$ 0,00</span>
                            </div>
                        </div>
                        <button class="btn btn-primary-gold w-100 py-3 mt-4 fw-bold" id="confirmOrder">
                            FINALIZAR PEDIDO
                        </button>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <footer id="footer"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/utils.js"></script>
    <script src="../assets/js/animations.js"></script>
    <script src="../assets/js/cart.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const cart = CartManager.getCart();
            const list = document.getElementById('checkoutItemsList');
            const subtotalEl = document.getElementById('summarySubtotal');
            const totalEl = document.getElementById('summaryTotal');

            if (cart.length === 0) {
                window.location.href = '../index.html';
                return;
            }

            let total = 0;
            list.innerHTML = cart.map(item => {
                total += item.preco * item.quantidade;
                return `
            <div class="d-flex justify-content-between align-items-center mb-3">
              <div class="d-flex align-items-center gap-2">
                <img src="${item.img}" width="40" height="50" style="object-fit: cover; border-radius: 4px;">
                <div>
                  <div class="text-white x-small fw-bold">${item.nome}</div>
                  <div class="text-secondary x-small">Qtd: ${item.quantidade}</div>
                </div>
              </div>
              <span class="text-white x-small">R$ ${(item.preco * item.quantidade).toFixed(2).replace('.', ',')}</span>
            </div>
          `;
            }).join('');

            subtotalEl.textContent = `R$ ${total.toFixed(2).replace('.', ',')}`;
            totalEl.textContent = `R$ ${total.toFixed(2).replace('.', ',')}`;

            document.getElementById('confirmOrder').addEventListener('click', () => {
                // Simulação de Sucesso
                alert('Pedido realizado com sucesso! (Simulado)');
                localStorage.removeItem('koketsu_cart');
                window.location.href = 'sucesso.html';
            });
        });
    </script>
</body>

</html>
