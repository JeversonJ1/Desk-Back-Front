<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finalizar Compra | Koketsu Grife</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = { corePlugins: { preflight: false } }
    </script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Outfit:wght@400;700;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/global/variables.css">
    <link rel="stylesheet" href="../assets/css/global/main.css">`n    <link rel="stylesheet" href="../assets/css/components/menu-modal.css">
    <link rel="stylesheet" href="../assets/css/global/footer.css">
    <link rel="stylesheet" href="../assets/css/components/checkout.css">
</head>

<body class="bg-black text-white">
    <!-- Header Renderizado em Utils.js -->
    <header></header>

    <main class="pt-24 pb-16">
        <div class="container mx-auto px-4 lg:px-12">
            <div class="flex flex-col lg:flex-row gap-8 lg:gap-12">

                <!-- Lado Esquerdo: Formulários -->
                <div class="w-full lg:w-3/5 xl:w-2/3 flex flex-col gap-8">

                    <!-- Passo 1: Entrega -->
                    <div class="bg-[#111] border border-white/5 rounded-2xl p-6 md:p-8 shadow-2xl relative overflow-hidden animate-[fadeIn_0.5s_ease_forwards]">
                        <div class="absolute top-0 left-0 w-1 h-full bg-[var(--brand-yellow)]"></div>
                        <h2 class="font-['Outfit'] text-2xl font-bold uppercase tracking-[0.1em] text-white flex items-center gap-4 mb-8">
                            <span class="flex items-center justify-center w-8 h-8 rounded-full bg-[var(--brand-yellow)] text-black font-extrabold text-sm">1</span> 
                            Dados de Entrega
                        </h2>
                        
                        <form class="grid grid-cols-1 md:grid-cols-12 gap-6">
                            <div class="md:col-span-4">
                                <label class="block text-xs font-bold text-gray-400 uppercase tracking-[0.1em] mb-2">CEP</label>
                                <input type="text" class="w-full bg-black text-white border border-gray-700 rounded-lg p-3 focus:border-[var(--brand-yellow)] focus:ring-1 focus:ring-[var(--brand-yellow)] outline-none transition" placeholder="00000-000">
                            </div>
                            <div class="md:col-span-8 flex items-center md:items-end">
                                <span class="text-xs text-[var(--brand-yellow)] tracking-wider font-bold uppercase hover:underline cursor-pointer transition">Simule o frete para sua região</span>
                            </div>
                            
                            <div class="md:col-span-12">
                                <label class="block text-xs font-bold text-gray-400 uppercase tracking-[0.1em] mb-2">Endereço</label>
                                <input type="text" class="w-full bg-black text-white border border-gray-700 rounded-lg p-3 focus:border-[var(--brand-yellow)] focus:ring-1 focus:ring-[var(--brand-yellow)] outline-none transition" placeholder="Rua, Avenida, etc">
                            </div>
                            
                            <div class="md:col-span-4">
                                <label class="block text-xs font-bold text-gray-400 uppercase tracking-[0.1em] mb-2">Número</label>
                                <input type="text" class="w-full bg-black text-white border border-gray-700 rounded-lg p-3 focus:border-[var(--brand-yellow)] focus:ring-1 focus:ring-[var(--brand-yellow)] outline-none transition" placeholder="123">
                            </div>
                            
                            <div class="md:col-span-8">
                                <label class="block text-xs font-bold text-gray-400 uppercase tracking-[0.1em] mb-2">Complemento</label>
                                <input type="text" class="w-full bg-black text-white border border-gray-700 rounded-lg p-3 focus:border-[var(--brand-yellow)] focus:ring-1 focus:ring-[var(--brand-yellow)] outline-none transition" placeholder="Apto, Bloco, etc">
                            </div>
                            
                            <div class="md:col-span-6">
                                <label class="block text-xs font-bold text-gray-400 uppercase tracking-[0.1em] mb-2">Bairro</label>
                                <input type="text" class="w-full bg-black text-white border border-gray-700 rounded-lg p-3 focus:border-[var(--brand-yellow)] focus:ring-1 focus:ring-[var(--brand-yellow)] outline-none transition">
                            </div>
                            
                            <div class="md:col-span-6">
                                <label class="block text-xs font-bold text-gray-400 uppercase tracking-[0.1em] mb-2">Cidade / UF</label>
                                <input type="text" class="w-full bg-black text-white border border-gray-700 rounded-lg p-3 focus:border-[var(--brand-yellow)] focus:ring-1 focus:ring-[var(--brand-yellow)] outline-none transition" placeholder="Ex: São Paulo - SP">
                            </div>
                        </form>
                    </div>

                    <!-- Passo 2: Pagamento -->
                    <div class="bg-[#111] border border-white/5 rounded-2xl p-6 md:p-8 shadow-2xl relative overflow-hidden animate-[fadeIn_0.5s_ease_forwards_0.2s] opacity-0" style="animation-fill-mode: forwards;">
                        <div class="absolute top-0 left-0 w-1 h-full bg-[var(--brand-yellow)]"></div>
                        <h2 class="font-['Outfit'] text-2xl font-bold uppercase tracking-[0.1em] text-white flex items-center gap-4 mb-8">
                            <span class="flex items-center justify-center w-8 h-8 rounded-full bg-[var(--brand-yellow)] text-black font-extrabold text-sm">2</span> 
                            Forma de Pagamento
                        </h2>
                        
                        <div class="grid grid-cols-2 gap-4 mb-6">
                            <div class="border-2 border-[var(--brand-yellow)] bg-black/50 text-[var(--brand-yellow)] rounded-xl p-4 flex flex-col items-center justify-center gap-2 cursor-pointer transition relative overflow-hidden group">
                                <div class="absolute inset-0 bg-[#F2C84B]/10"></div>
                                <i class="bi bi-qr-code text-3xl"></i>
                                <span class="text-xs font-bold tracking-[0.1em] uppercase">PIX (-5%)</span>
                                <div class="absolute top-2 right-2 w-4 h-4 rounded-full bg-[var(--brand-yellow)] flex items-center justify-center">
                                    <div class="w-2 h-2 rounded-full bg-black"></div>
                                </div>
                            </div>
                            
                            <div class="border border-gray-800 bg-black text-gray-400 rounded-xl p-4 flex flex-col items-center justify-center gap-2 cursor-pointer hover:border-gray-500 transition">
                                <i class="bi bi-credit-card text-3xl"></i>
                                <span class="text-xs font-bold tracking-[0.1em] uppercase">CARTÃO</span>
                            </div>
                        </div>
                        
                        <p class="text-xs text-gray-500 text-center font-bold tracking-wider">
                            O código PIX será gerado após a confirmação do pedido.
                        </p>
                    </div>

                </div>

                <!-- Lado Direito: Resumo -->
                <div class="w-full lg:w-2/5 xl:w-1/3">
                    <div class="sticky top-[100px] bg-gradient-to-b from-[#111] to-black border border-white/5 rounded-2xl p-6 md:p-8 shadow-2xl">
                        <h4 class="text-white font-['Outfit'] font-bold mb-6 uppercase text-lg tracking-[0.1em] border-b border-gray-800 pb-4">Resumo do Pedido</h4>
                        
                        <div id="checkoutItemsList" class="mb-6 flex flex-col gap-4">
                            <!-- Injetar via JS -->
                        </div>
                        
                        <div class="border-t border-gray-800 pt-6">
                            <div class="flex justify-between items-center mb-3">
                                <span class="text-gray-400 text-sm tracking-wider">Subtotal</span>
                                <span class="text-white text-sm font-bold" id="summarySubtotal">R$ 0,00</span>
                            </div>
                            <div class="flex justify-between items-center mb-6">
                                <span class="text-gray-400 text-sm tracking-wider">Frete</span>
                                <span class="text-green-500 text-sm font-bold tracking-[0.1em] uppercase">GRÁTIS</span>
                            </div>
                            <div class="flex justify-between items-center mt-4 pt-4 border-t border-gray-800">
                                <span class="text-white font-bold tracking-[0.1em] uppercase">TOTAL</span>
                                <span class="text-[var(--brand-yellow)] font-extrabold text-2xl" id="summaryTotal">R$ 0,00</span>
                            </div>
                        </div>
                        
                        <button class="w-full bg-[var(--brand-yellow)] text-black font-bold tracking-[0.1em] uppercase py-4 rounded-xl mt-8 hover:brightness-110 transition shadow-lg shadow-yellow-500/20" id="confirmOrder">
                            FINALIZAR PEDIDO
                        </button>
                        
                        <p class="text-[10px] text-gray-600 text-center mt-4 tracking-wider uppercase">Ambiente 100% Seguro</p>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <footer id="footer"></footer>

    <script src="../assets/js/utils.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            window.Utils.loadPartials();
        });
    </script>
    <script src="../assets/js/animations.js"></script>
    <script src="../assets/js/cart.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const cart = CartManager.getCart();
            const list = document.getElementById('checkoutItemsList');
            const subtotalEl = document.getElementById('summarySubtotal');
            const totalEl = document.getElementById('summaryTotal');

            if (cart.length === 0) {
                window.location.href = '/';
                return;
            }

            let total = 0;
            list.innerHTML = cart.map(item => {
                total += item.preco * item.quantidade;
                return `
            <div class="flex justify-between items-center bg-black p-3 rounded-xl border border-white/5">
              <div class="flex items-center gap-3">
                <img src="${item.img}" class="w-12 h-16 object-cover rounded-md border border-gray-800">
                <div>
                  <div class="text-white text-xs font-bold uppercase tracking-wider mb-1 line-clamp-1">${item.nome}</div>
                  <div class="text-gray-500 text-[10px] font-bold tracking-[0.1em] uppercase">Qtd: ${item.quantidade}</div>
                </div>
              </div>
              <span class="text-[var(--brand-yellow)] text-xs font-bold tracking-wider whitespace-nowrap">R$ ${(item.preco * item.quantidade).toFixed(2).replace('.', ',')}</span>
            </div>
          `;
            }).join('');

            subtotalEl.textContent = `R$ ${total.toFixed(2).replace('.', ',')}`;
            totalEl.textContent = `R$ ${total.toFixed(2).replace('.', ',')}`;

            document.getElementById('confirmOrder').addEventListener('click', () => {
                // Simulação de Sucesso
                alert('Pedido realizado com sucesso! (Simulado)');
                localStorage.removeItem('koketsu_cart');
                window.location.href = 'sucesso.html';
            });
        });
    </script>
    <script src="../assets/js/categorias.js"></script>
</body>

</html>
