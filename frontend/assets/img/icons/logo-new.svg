<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" width="100" height="100">
  <!-- Background -->
  <rect width="400" height="400" fill="transparent"/>
  
  <!-- KOKETSU Text -->
  <text x="200" y="95" font-family="Arial, sans-serif" font-size="70" font-weight="900" fill="#F8D346" text-anchor="middle" letter-spacing="2">KOKETSU</text>
  
  <!-- Tiger Head Group -->
  <g transform="translate(200, 200)">
    <!-- Main head outline -->
    <ellipse cx="0" cy="0" rx="50" ry="55" fill="none" stroke="#F8D346" stroke-width="3"/>
    
    <!-- Ears -->
    <path d="M -35 -55 L -45 -80 L -25 -50" fill="none" stroke="#F8D346" stroke-width="3" stroke-linejoin="round"/>
    <path d="M 35 -55 L 45 -80 L 25 -50" fill="none" stroke="#F8D346" stroke-width="3" stroke-linejoin="round"/>
    
    <!-- Eyes -->
    <circle cx="-18" cy="-15" r="5" fill="#F8D346"/>
    <circle cx="18" cy="-15" r="5" fill="#F8D346"/>
    <circle cx="-18" cy="-15" r="2" fill="#000"/>
    <circle cx="18" cy="-15" r="2" fill="#000"/>
    
    <!-- Nose -->
    <path d="M 0 0 L -5 10 L 5 10 Z" fill="#F8D346"/>
    
    <!-- Mouth -->
    <path d="M -5 10 Q -15 20 -20 15" stroke="#F8D346" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 5 10 Q 15 20 20 15" stroke="#F8D346" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    
    <!-- Whiskers -->
    <line x1="-60" y1="-8" x2="-35" y2="-8" stroke="#F8D346" stroke-width="2.5"/>
    <line x1="-60" y1="0" x2="-35" y2="0" stroke="#F8D346" stroke-width="2.5"/>
    <line x1="-60" y1="8" x2="-35" y2="8" stroke="#F8D346" stroke-width="2.5"/>
    <line x1="60" y1="-8" x2="35" y2="-8" stroke="#F8D346" stroke-width="2.5"/>
    <line x1="60" y1="0" x2="35" y2="0" stroke="#F8D346" stroke-width="2.5"/>
    <line x1="60" y1="8" x2="35" y2="8" stroke="#F8D346" stroke-width="2.5"/>
    
    <!-- Mane/Hair strokes -->
    <path d="M -40 -35 Q -45 -25 -40 -15" stroke="#F8D346" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M -45 -45 Q -50 -35 -45 -20" stroke="#F8D346" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M 40 -35 Q 45 -25 40 -15" stroke="#F8D346" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M 45 -45 Q 50 -35 45 -20" stroke="#F8D346" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
  
  <!-- GRIFE Text -->
  <text x="200" y="360" font-family="Arial, sans-serif" font-size="60" font-weight="900" fill="#F8D346" text-anchor="middle" letter-spacing="3">GRIFE</text>
</svg>