<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koketsu - Teste de API</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1 class="mb-4">🎯 Teste de Conexão - API Koketsu</h1>
        
        <!-- Dashboard com totais -->
        <div class="row mb-4">
            <div class="col-md-3">
                <div class="card text-white bg-primary">
                    <div class="card-body">
                        <h5 class="card-title">Produtos</h5>
                        <h2 id="total-produtos">-</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-white bg-success">
                    <div class="card-body">
                        <h5 class="card-title">Clientes</h5>
                        <h2 id="total-clientes">-</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-white bg-warning">
                    <div class="card-body">
                        <h5 class="card-title">Pedidos</h5>
                        <h2 id="total-pedidos">-</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-white bg-info">
                    <div class="card-body">
                        <h5 class="card-title">Categorias</h5>
                        <h2 id="total-categorias">-</h2>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tabela de Produtos -->
        <div class="card mb-4">
            <div class="card-header">
                <h3>📦 Produtos</h3>
            </div>
            <div class="card-body">
                <table class="table table-striped" id="tabela-produtos">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nome</th>
                            <th>Descrição</th>
                            <th>Preço</th>
                            <th>Estoque</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td colspan="5" class="text-center">Carregando...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Tabela de Pedidos -->
        <div class="card mb-4">
            <div class="card-header">
                <h3>🛒 Pedidos</h3>
            </div>
            <div class="card-body">
                <table class="table table-striped" id="tabela-pedidos">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Cliente</th>
                            <th>Total</th>
                            <th>Status</th>
                            <th>Data</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td colspan="5" class="text-center">Carregando...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Lista de Clientes -->
        <div class="card">
            <div class="card-header">
                <h3>👥 Clientes</h3>
            </div>
            <div class="card-body">
                <div id="lista-clientes">
                    <p class="text-center">Carregando...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Código inline para teste rápido
        async function carregarDados() {
            const baseURL = 'http://localhost:8000/api/database';

            // Carregar totais
            try {
                const [produtos, clientes, pedidos, categorias] = await Promise.all([
                    fetch(`${baseURL}/produtos`).then(r => r.json()),
                    fetch(`${baseURL}/clientes`).then(r => r.json()),
                    fetch(`${baseURL}/pedidos`).then(r => r.json()),
                    fetch(`${baseURL}/categorias`).then(r => r.json())
                ]);

                document.getElementById('total-produtos').textContent = produtos.total || 0;
                document.getElementById('total-clientes').textContent = clientes.total || 0;
                document.getElementById('total-pedidos').textContent = pedidos.total || 0;
                document.getElementById('total-categorias').textContent = categorias.total || 0;

                // Carregar produtos na tabela
                const tbodyProdutos = document.querySelector('#tabela-produtos tbody');
                tbodyProdutos.innerHTML = '';
                (produtos.dados || []).slice(0, 10).forEach(p => {
                    tbodyProdutos.innerHTML += `
                        <tr>
                            <td>${p.id_produto}</td>
                            <td>${p.nome_produtos}</td>
                            <td>${p.descricao_produtos || '-'}</td>
                            <td>R$ ${parseFloat(p.preco_produtos || 0).toFixed(2)}</td>
                            <td>${p.estoque_produtos}</td>
                        </tr>
                    `;
                });

                // Carregar pedidos na tabela
                const tbodyPedidos = document.querySelector('#tabela-pedidos tbody');
                tbodyPedidos.innerHTML = '';
                (pedidos.dados || []).slice(0, 10).forEach(p => {
                    const statusClass = p.status_pedidos === 'Concluído' ? 'success' : 
                                       p.status_pedidos === 'Pendente' ? 'warning' : 'info';
                    tbodyPedidos.innerHTML += `
                        <tr>
                            <td>${p.id_pedido}</td>
                            <td>${p.nome_clientes || 'Cliente Desconhecido'}</td>
                            <td>R$ ${parseFloat(p.total_pedidos || 0).toFixed(2)}</td>
                            <td><span class="badge bg-${statusClass}">${p.status_pedidos}</span></td>
                            <td>${new Date(p.data_pedido).toLocaleDateString('pt-BR')}</td>
                        </tr>
                    `;
                });

                // Carregar clientes
                const listaClientes = document.getElementById('lista-clientes');
                listaClientes.innerHTML = '';
                (clientes.dados || []).slice(0, 5).forEach(c => {
                    listaClientes.innerHTML += `
                        <div class="card mb-2">
                            <div class="card-body">
                                <h6 class="card-title">${c.nome_clientes}</h6>
                                <p class="card-text small mb-0">
                                    📧 ${c.email_clientes}<br>
                                    📞 ${c.telefone_clientes}<br>
                                    📍 ${c.endereco_clientes}
                                </p>
                            </div>
                        </div>
                    `;
                });

                console.log('✅ Dados carregados com sucesso!');
            } catch (error) {
                console.error('❌ Erro ao carregar dados:', error);
                alert('Erro ao conectar com a API! Verifique se o servidor PHP está rodando.');
            }
        }

        // Carregar quando a página estiver pronta
        window.addEventListener('DOMContentLoaded', carregarDados);
    </script>
</body>
</html>
