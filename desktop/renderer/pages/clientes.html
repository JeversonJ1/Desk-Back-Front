<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <style>
    html,
    body {
      background: #0f0f0f;
      color: #fff;
    }
  </style>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clientes</title>

  <link href="../../node_modules/bootstrap/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .cliente-card {
      background: linear-gradient(135deg, #1a1a1a 0%, #0f0f0f 100%);
      border: 1px solid #333;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      transition: all 0.3s ease;
    }

    .cliente-card:hover {
      border-color: #F2C84B;
      box-shadow: 0 4px 12px rgba(255, 216, 77, 0.2);
      transform: translateY(-2px);
    }

    .cliente-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    .cliente-dados {
      flex: 1;
    }

    .cliente-nome {
      font-size: 16px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 4px;
    }

    .cliente-detalhes {
      font-size: 13px;
      color: #888;
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }

    .cliente-detalhes span {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .cliente-acoes {
      display: flex;
      gap: 8px;
    }

    #gridClientes {
      display: grid;
      gap: 12px;
    }

    .input-group-text {
      background: #1a1a1a;
      border-color: #444;
      color: #888;
    }
  </style>
</head>

<body>

  <div class="app">
    <aside class="sidebar">
      <img src="../assets/img/logo.jpg" class="logo">
      <nav class="menu">
        <a href="dashboard.html">Dashboard</a>
        <a href="produtos.html">Produtos</a>
        <a href="pedidos.html">Pedidos</a>
        <a class="active" href="clientes.html">Clientes</a>
        <a href="configuracoes.html">Configurações</a>
        <a href="#" data-logout class="menu-logout">Sair</a>
      </nav>
    </aside>

    <main class="content">
      <div class="mobile-topbar">
        <button class="sidebar-toggle" data-sidebar-toggle aria-label="Abrir menu" title="Menu">☰</button>
        <span class="mobile-title">Clientes</span>
      </div>
      <div class="dashboard-header">
        <div>
          <h1>Gerenciar Clientes</h1>
          <p>Administre seus clientes e histórico de compras</p>
        </div>
        <button class="btn btn-gold" id="btnNovoCliente">Novo Cliente</button>
      </div>

      <!-- BUSCA E FILTRO -->
      <div class="card mb-4">
        <div class="filters-row" style="display: flex; gap: 12px; align-items: flex-end;">
          <div style="flex: 2; min-width: 240px;">
            <label
              style="font-size: 12px; color: #bbb; text-transform: uppercase; font-weight: 600; margin-bottom: 6px; display: block;">Buscar
              Cliente</label>
            <input type="text" id="searchCliente" class="form-control" placeholder="Nome ou email...">
          </div>
          <div style="flex: 1.5; min-width: 180px;">
            <label
              style="font-size: 12px; color: #bbb; text-transform: uppercase; font-weight: 600; margin-bottom: 6px; display: block;">Cidade</label>
            <select id="filterCidade" class="form-control">
              <option value="">Todas as cidades</option>
            </select>
          </div>
          <div style="flex: 1.5; min-width: 180px;">
            <label
              style="font-size: 12px; color: #bbb; text-transform: uppercase; font-weight: 600; margin-bottom: 6px; display: block;">Ordenar</label>
            <select id="ordenarPor" class="form-control">
              <option value="nome-az">Nome (A → Z)</option>
              <option value="nome-za">Nome (Z → A)</option>
              <option value="data-recente">Mais Recente</option>
              <option value="data-antigo">Mais Antigo</option>
            </select>
          </div>
          <button id="limparFiltros" class="btn btn-outline-secondary"
            style="padding: 10px 14px; font-size: 13px; font-weight: 600; border: 2px solid #555; border-radius: 8px; background: transparent; color: #fff; transition: all 0.3s; white-space: nowrap; height: 38px;"
            title="Limpar todos os filtros">Limpar</button>
        </div>
      </div>

      <!-- GRID DE CLIENTES -->
      <div id="gridClientes">
        <p class="text-muted col-12">Carregando clientes...</p>
      </div>
    </main>

    <div class="sidebar-backdrop" data-sidebar-backdrop></div>
  </div>

  <!-- MODAL CLIENTE -->
  <div class="modal" id="modalCliente" style="display: none;">
    <div class="modal-content" style="max-width: 600px;">
      <div class="modal-header"
        style="background: linear-gradient(135deg, #2a2a2a 0%, #1a1a1a 100%); padding: 20px 30px; border-bottom: 2px solid #F2C84B; border-radius: 12px 12px 0 0;">
        <div style="display: flex; align-items: center; gap: 12px;">
          <div
            style="background: #F2C84B; width: 40px; height: 40px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700; color: #0f0f0f;">
            C</div>
          <h2 style="margin: 0; color: #fff;" id="modalTitulo">Novo Cliente</h2>
        </div>
        <span class="close" id="cancelarModal"
          style="font-size: 28px; font-weight: bold; cursor: pointer; color: #888;">&times;</span>
      </div>
      <div class="modal-body" style="padding: 30px;">
        <div class="row">
          <div class="col-12 mb-3">
            <label class="form-label" style="color: #F2C84B; font-weight: 500;">Nome Completo *</label>
            <input type="text" id="nome" class="form-control" placeholder="Ex: João Silva" autocomplete="off"
              style="background: #0f0f0f; border: 2px solid #333; color: #fff;">
          </div>

          <div class="col-md-6 mb-3">
            <label class="form-label" style="color: #F2C84B; font-weight: 500;">Email *</label>
            <input type="email" id="email" class="form-control" placeholder="Ex: joao@email.com" autocomplete="off"
              style="background: #0f0f0f; border: 2px solid #333; color: #fff;">
            <small class="text-danger" id="emailErro" style="display: none;">Email inválido</small>
          </div>

          <div class="col-md-6 mb-3">
            <label class="form-label" style="color: #F2C84B; font-weight: 500;">Telefone</label>
            <input type="tel" id="telefone" class="form-control" placeholder="(11) 99999-9999" autocomplete="off"
              maxlength="15" style="background: #0f0f0f; border: 2px solid #333; color: #fff;">
          </div>

          <div class="col-md-6 mb-3">
            <label class="form-label" style="color: #F2C84B; font-weight: 500;">CPF/CNPJ</label>
            <input type="text" id="cpf" class="form-control" placeholder="000.000.000-00" autocomplete="off"
              maxlength="18" style="background: #0f0f0f; border: 2px solid #333; color: #fff;">
            <small class="text-danger" id="cpfErro" style="display: none;">CPF/CNPJ inválido</small>
          </div>

          <div class="col-md-6 mb-3">
            <label class="form-label" style="color: #F2C84B; font-weight: 500;">Data Nascimento</label>
            <input type="date" id="dataNascimento" class="form-control" autocomplete="off"
              style="background: #0f0f0f; border: 2px solid #333; color: #fff;">
          </div>

          <div class="col-md-4 mb-3">
            <label class="form-label" style="color: #F2C84B; font-weight: 500;">CEP</label>
            <input type="text" id="cep" class="form-control" placeholder="00000-000" autocomplete="off" maxlength="9"
              style="background: #0f0f0f; border: 2px solid #333; color: #fff;">
          </div>

          <div class="col-md-8 mb-3">
            <label class="form-label" style="color: #F2C84B; font-weight: 500;">Endereço</label>
            <input type="text" id="endereco" class="form-control" placeholder="Rua, Avenida..." autocomplete="off"
              style="background: #0f0f0f; border: 2px solid #333; color: #fff;">
          </div>

          <div class="col-md-4 mb-3">
            <label class="form-label" style="color: #F2C84B; font-weight: 500;">Número</label>
            <input type="text" id="numero" class="form-control" placeholder="123" autocomplete="off"
              style="background: #0f0f0f; border: 2px solid #333; color: #fff;">
          </div>

          <div class="col-md-4 mb-3">
            <label class="form-label" style="color: #F2C84B; font-weight: 500;">Bairro</label>
            <input type="text" id="bairro" class="form-control" placeholder="Centro" autocomplete="off"
              style="background: #0f0f0f; border: 2px solid #333; color: #fff;">
          </div>

          <div class="col-md-4 mb-3">
            <label class="form-label" style="color: #F2C84B; font-weight: 500;">Cidade</label>
            <input type="text" id="cidade" class="form-control" placeholder="São Paulo" autocomplete="off"
              style="background: #0f0f0f; border: 2px solid #333; color: #fff;">
          </div>

          <div class="col-12 mb-3">
            <label class="form-label" style="color: #F2C84B; font-weight: 500;">Observações</label>
            <textarea id="observacoes" class="form-control" rows="2"
              placeholder="Informações adicionais sobre o cliente..." autocomplete="off"
              style="background: #0f0f0f; border: 2px solid #333; color: #fff;"></textarea>
          </div>
        </div>
        <small style="color: #888;">* Campos obrigatórios</small>
      </div>
      <div class="modal-footer"
        style="padding: 20px 30px; border-top: 1px solid #333; display: flex; gap: 12px; justify-content: flex-end;">
        <button class="btn btn-outline-secondary" id="cancelarModalBtn">Cancelar</button>
        <button class="btn btn-gold" id="salvarCliente">Salvar Cliente</button>
      </div>
    </div>
  </div>

  <script type="module" src="../js/auth.js"></script>
  <script type="module" src="../js/clientes.js"></script>
</body>

</html>
