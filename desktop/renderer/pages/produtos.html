<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <style>
    html,
    body {
      background: #0f0f0f;
      color: #fff;
    }
  </style>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produtos</title>

  <link href="../../node_modules/bootstrap/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    /* Estilos para placeholders dos inputs de tamanhos */
    #novoTamanho::placeholder,
    #novaQuantidade::placeholder {
      color: #fff !important;
      opacity: 0.7;
    }

    #novoTamanho,
    #novaQuantidade {
      background: #1a1a1a !important;
      border-color: #444 !important;
      color: #fff !important;
    }

    #novoTamanho:focus,
    #novaQuantidade:focus {
      background: #1a1a1a !important;
      border-color: #F2C84B !important;
      color: #fff !important;
    }

    /* Remover setas dos inputs numéricos */
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    input[type=number] {
      -moz-appearance: textfield;
      appearance: textfield;
    }
  </style>
</head>

<body>

  <div class="app">
    <aside class="sidebar">
      <img src="../assets/img/logo.jpg" class="logo">
      <nav class="menu">
        <a href="dashboard.html">Dashboard</a>
        <a class="active" href="produtos.html">Produtos</a>
        <a href="pedidos.html">Pedidos</a>
        <a href="clientes.html">Clientes</a>
        <a href="configuracoes.html">Configurações</a>
        <a href="#" data-logout class="menu-logout">Sair</a>
      </nav>
    </aside>

    <main class="content">
      <div class="mobile-topbar">
        <button class="sidebar-toggle" data-sidebar-toggle aria-label="Abrir menu" title="Menu">☰</button>
        <span class="mobile-title">Produtos</span>
      </div>
      <div class="dashboard-header">
        <div>
          <h1>Estoque de Produtos</h1>
          <p>Gerencie seus produtos</p>
        </div>
        <button class="btn btn-gold" id="btnNovoProduto">Novo Produto</button>
      </div>

      <!-- BUSCA E FILTRO -->
      <div class="card mb-4">
        <div class="filters-row" style="display: flex; gap: 12px; align-items: flex-end;">
          <div style="flex: 1.5; min-width: 220px;">
            <label
              style="font-size: 12px; color: #bbb; text-transform: uppercase; font-weight: 600; margin-bottom: 6px; display: block;">Buscar
              Produto</label>
            <input type="text" id="searchProduto" class="form-control" placeholder="Nome ou categoria...">
          </div>
          <div style="flex: 1; min-width: 140px;">
            <label
              style="font-size: 12px; color: #bbb; text-transform: uppercase; font-weight: 600; margin-bottom: 6px; display: block;">Categoria</label>
            <select id="filterCategoria" class="form-control">
              <option value="">Todas as categorias</option>
            </select>
          </div>
          <div style="flex: 1; min-width: 140px;">
            <label
              style="font-size: 12px; color: #bbb; text-transform: uppercase; font-weight: 600; margin-bottom: 6px; display: block;">Tamanho</label>
            <select id="filterTamanho" class="form-control">
              <option value="">Todos os tamanhos</option>
            </select>
          </div>
          <div style="flex: 1; min-width: 140px;">
            <label
              style="font-size: 12px; color: #bbb; text-transform: uppercase; font-weight: 600; margin-bottom: 6px; display: block;">Estoque</label>
            <select id="filterEstoque" class="form-control">
              <option value="">Todo estoque</option>
              <option value="em-falta">Em falta</option>
              <option value="baixo">Baixo (1-10)</option>
              <option value="medio">Médio (11-30)</option>
              <option value="alto">Alto (31+)</option>
            </select>
          </div>
          <div style="flex: 1; min-width: 140px;">
            <label
              style="font-size: 12px; color: #bbb; text-transform: uppercase; font-weight: 600; margin-bottom: 6px; display: block;">Ordenar</label>
            <select id="ordenarPor" class="form-control">
              <option value="nome-az">Nome (A → Z)</option>
              <option value="nome-za">Nome (Z → A)</option>
              <option value="preco-menor">Preço (menor)</option>
              <option value="preco-maior">Preço (maior)</option>
              <option value="estoque-menor">Estoque (menor)</option>
              <option value="estoque-maior">Estoque (maior)</option>
            </select>
          </div>
          <button id="limparFiltros" class="btn btn-outline-secondary"
            style="padding: 10px 14px; font-size: 13px; font-weight: 600; border: 2px solid #555; border-radius: 8px; background: transparent; color: #fff; transition: all 0.3s; white-space: nowrap; height: 38px;"
            title="Limpar todos os filtros">Limpar</button>
        </div>
      </div>

      <!-- GRID DE PRODUTOS -->
      <div id="gridProdutos" class="produtos-estoque-grid">
        <p class="text-muted col-12">Carregando produtos...</p>
      </div>
    </main>

    <div class="sidebar-backdrop" data-sidebar-backdrop></div>
  </div>

  <!-- MODAL PRODUTO -->
  <div class="modal" id="modalProduto" style="display: none;">
    <div class="modal-content" style="max-width: 900px; max-height: 90vh; overflow-y: auto;">
      <div class="modal-header"
        style="background: linear-gradient(135deg, #2a2a2a 0%, #1a1a1a 100%); padding: 20px 30px; border-bottom: 2px solid #F2C84B; border-radius: 12px 12px 0 0;">
        <div style="display: flex; align-items: center; gap: 12px;">
          <div
            style="background: #F2C84B; width: 40px; height: 40px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 20px; color: #000; font-weight: bold;">
            P</div>
          <h3 id="modalTitulo" style="margin: 0; color: #F2C84B; font-size: 22px; font-weight: 600;">Novo Produto</h3>
        </div>
        <button class="btn-close-modal" id="cancelarModal"
          style="background: none; border: none; color: #fff; font-size: 32px; cursor: pointer; padding: 0; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 6px; transition: all 0.2s;"
          onmouseover="this.style.background='#ff4444'; this.style.transform='rotate(90deg)';"
          onmouseout="this.style.background='none'; this.style.transform='rotate(0deg)';">&times;</button>
      </div>

      <div class="modal-body" style="padding: 30px;">
        <div class="row">
          <div class="col-md-7" style="padding-right: 20px;">
            <div style="margin-bottom: 20px;">
              <label
                style="color: #F2C84B; font-weight: 500; font-size: 13px; display: flex; align-items: center; gap: 6px; margin-bottom: 8px;">
                <span
                  style="background: #F2C84B; color: #000; width: 20px; height: 20px; border-radius: 4px; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700;">✓</span>
                Nome do Produto *
              </label>
              <input type="text" id="nome" class="form-control" placeholder="Digite o nome do produto"
                autocomplete="off"
                style="background: #0f0f0f; border: 2px solid #333; color: #fff; padding: 12px 15px; border-radius: 8px; font-size: 14px; transition: all 0.3s;"
                onfocus="this.style.borderColor='#F2C84B'; this.style.boxShadow='0 0 0 3px rgba(255,216,77,0.1)';"
                onblur="this.style.borderColor='#333'; this.style.boxShadow='none';">
            </div>

            <div style="margin-bottom: 20px;">
              <label
                style="color: #F2C84B; font-weight: 500; font-size: 13px; display: flex; align-items: center; gap: 6px; margin-bottom: 8px;">
                📝 Descrição
              </label>
              <textarea id="descricao" class="form-control" placeholder="Descreva o produto (opcional)" rows="3"
                autocomplete="off"
                style="background: #0f0f0f; border: 2px solid #333; color: #fff; padding: 12px 15px; border-radius: 8px; font-size: 14px; transition: all 0.3s; resize: vertical;"
                onfocus="this.style.borderColor='#F2C84B'; this.style.boxShadow='0 0 0 3px rgba(255,216,77,0.1)';"
                onblur="this.style.borderColor='#333'; this.style.boxShadow='none';"></textarea>
            </div>

            <div class="row" style="margin-bottom: 20px;">
              <div class="col-md-6" style="padding-right: 10px;">
                <label
                  style="color: #F2C84B; font-weight: 500; font-size: 13px; display: flex; align-items: center; gap: 6px; margin-bottom: 8px;">
                  Categoria
                </label>
                <input list="categoriasList" type="text" id="categoria" class="form-control"
                  placeholder="Ex: Roupas, Calçados" autocomplete="off"
                  style="background: #0f0f0f; border: 2px solid #333; color: #fff; padding: 12px 15px; border-radius: 8px; font-size: 14px; transition: all 0.3s;"
                  onfocus="this.style.borderColor='#F2C84B'; this.style.boxShadow='0 0 0 3px rgba(255,216,77,0.1)';"
                  onblur="this.style.borderColor='#333'; this.style.boxShadow='none';">
                <datalist id="categoriasList">
                  <option value="Roupas">
                  <option value="Calçados">
                  <option value="Acessórios">
                  <option value="Bolsas">
                  <option value="Jóias">
                  <option value="Relógios">
                  <option value="Eletrônicos">
                  <option value="Casa">
                  <option value="Outros">
                </datalist>
              </div>
              <div class="col-md-6" style="padding-left: 10px;">
                <label
                  style="color: #F2C84B; font-weight: 500; font-size: 13px; display: flex; align-items: center; gap: 6px; margin-bottom: 8px;">
                  💰 Preço *
                </label>
                <input type="text" id="preco" class="form-control" placeholder="0,00" inputmode="decimal"
                  autocomplete="off"
                  style="background: #0f0f0f; border: 2px solid #333; color: #fff; padding: 12px 15px; border-radius: 8px; font-size: 14px; transition: all 0.3s;"
                  onfocus="this.style.borderColor='#F2C84B'; this.style.boxShadow='0 0 0 3px rgba(255,216,77,0.1)';"
                  onblur="this.style.borderColor='#333'; this.style.boxShadow='none';">
              </div>
            </div>

            <div style="margin-bottom: 20px;">
              <label
                style="color: #F2C84B; font-weight: 500; font-size: 13px; display: flex; align-items: center; gap: 6px; margin-bottom: 8px;">
                📊 Quantidade em Estoque *
              </label>
              <input type="number" id="qtd" class="form-control" placeholder="Digite a quantidade" min="0"
                style="background: #0f0f0f; border: 2px solid #333; color: #fff; padding: 12px 15px; border-radius: 8px; font-size: 14px; transition: all 0.3s;"
                onfocus="this.style.borderColor='#F2C84B'; this.style.boxShadow='0 0 0 3px rgba(255,216,77,0.1)';"
                onblur="this.style.borderColor='#333'; this.style.boxShadow='none';">
            </div>

            <div style="margin-bottom: 20px;">
              <label
                style="color: #F2C84B; font-weight: 500; font-size: 14px; display: flex; align-items: center; gap: 8px; margin-bottom: 10px;">
                📏 Tamanhos Disponíveis
              </label>
              <div class="tamanhos-container"
                style="border: 2px solid #333; border-radius: 8px; padding: 15px; background: linear-gradient(135deg, #2a2a2a 0%, #1f1f1f 100%); box-shadow: 0 2px 8px rgba(0,0,0,0.3);">
                <div class="row mb-3" style="gap: 8px;">
                  <div class="col" style="flex: 1.5;">
                    <input type="text" id="novoTamanho" class="form-control" placeholder="Ex: P, M, G, 38, 40"
                      autocomplete="off"
                      style="background: #0f0f0f; border: 1px solid #555; color: #fff; padding: 10px 12px; border-radius: 6px; font-size: 13px;">
                  </div>
                  <div class="col" style="flex: 1;">
                    <input type="number" id="novaQuantidade" class="form-control" placeholder="Qtd" min="0"
                      style="background: #0f0f0f; border: 1px solid #555; color: #fff; padding: 10px 12px; border-radius: 6px; font-size: 13px;">
                  </div>
                  <div class="col-auto">
                    <button type="button" class="btn btn-gold" id="btnAdicionarTamanho"
                      style="padding: 10px 20px; font-weight: 600; font-size: 16px; border-radius: 6px; box-shadow: 0 2px 6px rgba(255,216,77,0.3);">+
                      Adicionar</button>
                  </div>
                </div>
                <div id="listaTamanhos" style="max-height: 160px; overflow-y: auto; padding-right: 5px;">
                  <!-- Tamanhos adicionados aparecerão aqui -->
                </div>
              </div>
            </div>
          </div>

          <div class="col-md-5" style="padding-left: 20px; border-left: 1px solid #333;">
            <label
              style="color: #F2C84B; font-weight: 500; font-size: 13px; display: flex; align-items: center; gap: 6px; margin-bottom: 8px;">
              🖼️ Imagem do Produto
            </label>
            <div
              style="background: #0f0f0f; border: 2px dashed #555; border-radius: 8px; padding: 20px; text-align: center; transition: all 0.3s; cursor: pointer; position: relative;"
              onclick="document.getElementById('imagem').click();"
              onmouseover="this.style.borderColor='#F2C84B'; this.style.background='#1a1a1a';"
              onmouseout="this.style.borderColor='#555'; this.style.background='#0f0f0f';">
              <img id="preview"
                style="display:none; width: 100%; max-height: 260px; object-fit: contain; margin-bottom: 10px; border-radius: 6px;"
                alt="Pré-visualização">
              <div id="uploadPlaceholder" style="padding: 40px 20px;">
                <div style="font-size: 48px; margin-bottom: 10px; opacity: 0.5;">📸</div>
                <p style="color: #888; margin: 0; font-size: 14px;">Clique para selecionar uma imagem</p>
                <p style="color: #666; margin: 5px 0 0 0; font-size: 12px;">JPG, PNG ou WebP</p>
              </div>
            </div>

            <!-- Ações da imagem -->
            <div style="display: flex; gap: 8px; margin-top: 10px;">
              <button type="button" id="btnTrocarImagem" onclick="document.getElementById('imagem').click();"
                style="flex: 1; padding: 8px; background: #1a1a1a; border: 1.5px solid #444; border-radius: 6px; color: #ccc; font-size: 13px; cursor: pointer; transition: all 0.2s;"
                onmouseover="this.style.borderColor='#F2C84B'; this.style.color='#F2C84B';"
                onmouseout="this.style.borderColor='#444'; this.style.color='#ccc';">
                📁 Trocar imagem
              </button>
              <button type="button" id="btnRemoverImagem"
                style="display: none; padding: 8px 14px; background: #2a0000; border: 1.5px solid #ff4444; border-radius: 6px; color: #ff6666; font-size: 13px; cursor: pointer; transition: all 0.2s;"
                onmouseover="this.style.background='#3a0000'; this.style.borderColor='#ff0000';"
                onmouseout="this.style.background='#2a0000'; this.style.borderColor='#ff4444';">
                🗑️ Remover
              </button>
            </div>

            <input type="file" id="imagem" class="form-control" accept="image/*" style="display: none;">
          </div>
        </div>
      </div>

      <div class="modal-footer"
        style="background: #1a1a1a; padding: 20px 30px; border-top: 1px solid #333; border-radius: 0 0 12px 12px; display: flex; justify-content: space-between; align-items: center;">
        <p style="color: #888; margin: 0; font-size: 13px;">* Campos obrigatórios</p>
        <div style="display: flex; gap: 12px;">
          <button class="btn btn-outline-secondary" id="cancelarModalBtn"
            style="padding: 12px 30px; font-weight: 600; border: 2px solid #555; border-radius: 8px; background: transparent; color: #fff; transition: all 0.2s;"
            onmouseover="this.style.background='#333'; this.style.borderColor='#777';"
            onmouseout="this.style.background='transparent'; this.style.borderColor='#555';">Cancelar</button>
          <button class="btn btn-gold" id="salvarProduto"
            style="padding: 12px 35px; font-weight: 600; border-radius: 8px; box-shadow: 0 4px 12px rgba(255,216,77,0.3); transition: all 0.2s;"
            onmouseover="this.style.transform='translateY(-2px)'; this.style.boxShadow='0 6px 16px rgba(255,216,77,0.4)';"
            onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='0 4px 12px rgba(255,216,77,0.3)';">💾
            Salvar Produto</button>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="../js/auth.js"></script>
  <script type="module" src="../js/produtos.js"></script>
</body>

</html>
